name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-tests:
    name: Simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests
        run: tests/run_tests.sh

  vex-sdk-build:
    name: Compile with the VEX V5 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler
        run: clang++ --version
      - name: Compile the library and examples for the V5 brain
        run: ci/build_with_vex_sdk.sh
