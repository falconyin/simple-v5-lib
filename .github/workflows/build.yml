name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vex_sdk_version:
        description: "VEX SDK to build with (empty = the pinned one below), e.g. to try a newer SDK"
        required: false
        default: ""

jobs:
  simulator-tests:
    name: Simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the tests
        run: tests/run_tests.sh

  vex-sdk-build:
    name: Build with the VEX V5 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned, so a new SDK release can't turn an unchanged PR red. To move to a newer SDK, run this
      # workflow by hand with its version (the versions are in the SDK's manifest.json, see
      # ci/build_with_vex_sdk.sh), then change it here.
      VEX_SDK_VERSION: ${{ inputs.vex_sdk_version || 'V5_20240802_15_00_00' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM linker
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - name: Show tools
        run: clang++ --version && arm-none-eabi-ld --version | head -1
      - name: Build the library and examples for the V5 brain
        run: ci/build_with_vex_sdk.sh
